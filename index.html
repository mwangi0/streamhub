<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StreamHub - Video Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffc107;
            border-radius: 5px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #0f0f0f;
            padding: 0.8rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffc107;
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .hero {
            margin-bottom: 2rem;
            padding: 1rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: #aaa;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem 1.5rem;
        }

        .video-card {
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #fff;
            display: block;
        }

        .video-card:hover {
            transform: translateY(-2px);
        }

        .thumbnail-container {
            position: relative;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 0.75rem 0.25rem;
        }

        .video-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
            font-size: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 0.75rem;
            color: #aaa;
        }

        .empty-state, .loading-state, .error-state {
            text-align: center;
            padding: 4rem;
            background: #1a1a1a;
            border-radius: 12px;
        }

        .error-state {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid #272727;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            .videos-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1rem;
            }
            .hero h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🎬 StreamHub</a>
            <ul class="nav-links">
                <li><a class="nav-home">HOME</a></li>
                <li><a class="nav-categories">CATEGORIES</a></li>
                <li><a class="nav-live">LIVE CAMS</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="hero">
            <div>
                <h1 id="pageTitle">Recommended</h1>
                <p id="pageDesc">Your personal video streaming platform</p>
            </div>
        </div>

        <div class="videos-grid" id="videosGrid">
            <div class="loading-state">
                <h3>⏳ Loading videos...</h3>
                <p>Please wait while we fetch your content</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2024 StreamHub - Video Platform</p>
    </div>

    <script>
        // ⚠️ WARNING: This API key is publicly exposed!
        // Anyone can see and use it. Regenerate it immediately on StreamHub!
        const API_KEY = "0f92bed49f55e08f8918";
        
        // ============================================
        // CRITICAL: These URLs NEED to be corrected!
        // I don't know StreamHub's actual API endpoints.
        // Please provide the correct API documentation.
        // ============================================
        const STREAMHUB_API_BASE = "https://api.streamhub.com/v1";
        const STREAMHUB_ENDPOINT = "/videos";
        
        let allVideos = [];
        
        function showLoadingState() {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = `
                <div class="loading-state">
                    <h3>⏳ Loading videos...</h3>
                    <p>Please wait while we fetch your content</p>
                </div>
            `;
        }
        
        function showEmptyState() {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>📁 No videos found</h3>
                    <p>Upload some videos to your StreamHub account first</p>
                </div>
            `;
        }
        
        function showErrorState(errorMessage) {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = `
                <div class="error-state">
                    <h3>❌ Error loading videos</h3>
                    <p>${errorMessage}</p>
                    <p style="margin-top: 10px; font-size: 12px;">API endpoints need to be corrected. Please provide StreamHub API documentation.</p>
                </div>
            `;
        }
        
        function formatViews(views) {
            if (!views) return "0 views";
            if (views >= 1000000) return (views / 1000000).toFixed(1) + "M views";
            if (views >= 1000) return (views / 1000).toFixed(1) + "K views";
            return views + " views";
        }
        
        function renderVideoGrid(videos) {
            const grid = document.getElementById('videosGrid');
            
            if (!videos || videos.length === 0) {
                showEmptyState();
                return;
            }
            
            let html = '';
            
            videos.forEach(video => {
                const displayTitle = video.title.length > 50 ? video.title.substring(0, 50) + '...' : video.title;
                const viewsText = formatViews(video.views);
                
                const playerUrl = `player.html?url=${encodeURIComponent(video.embedUrl)}&title=${encodeURIComponent(video.title)}&views=${encodeURIComponent(viewsText)}`;
                
                html += `
                    <a href="${playerUrl}" class="video-card">
                        <div class="thumbnail-container">
                            <img src="${video.thumbnail}" alt="${video.title}" 
                                 onerror="this.src='https://via.placeholder.com/320x180?text=No+Thumbnail'">
                        </div>
                        <div class="video-info">
                            <div class="video-title">${displayTitle}</div>
                            <div class="video-meta">${viewsText}</div>
                        </div>
                    </a>
                `;
            });
            
            grid.innerHTML = html;
        }
        
        // Sample fallback videos
        function loadSampleVideos() {
            allVideos = [
                {
                    id: "sample1",
                    title: "⚠️ API Not Configured - Please provide StreamHub API documentation",
                    thumbnail: "https://via.placeholder.com/320x180?text=API+Needs+Setup",
                    embedUrl: "#",
                    views: 0
                }
            ];
            renderVideoGrid(allVideos);
            showErrorState("StreamHub API endpoints need to be corrected. Please share the API documentation.");
        }
        
        async function loadVideos() {
            try {
                showLoadingState();
                
                // Attempt to fetch from StreamHub API
                const apiUrl = `${STREAMHUB_API_BASE}${STREAMHUB_ENDPOINT}`;
                
                console.log("Attempting to fetch:", apiUrl);
                console.log("Using API Key:", API_KEY);
                
                // Try authentication as Bearer token
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log("API Response:", data);
                
                // Try to extract videos from response (adjust based on actual API)
                let videos = [];
                if (Array.isArray(data)) {
                    videos = data;
                } else if (data.videos && Array.isArray(data.videos)) {
                    videos = data.videos;
                } else if (data.data && Array.isArray(data.data)) {
                    videos = data.data;
                } else if (data.results && Array.isArray(data.results)) {
                    videos = data.results;
                } else {
                    throw new Error("Unknown response format");
                }
                
                if (videos.length > 0) {
                    allVideos = videos.map(video => ({
                        id: video.id || video.video_id || video.file_code,
                        title: video.title || video.name || video.file_name || "Untitled Video",
                        thumbnail: video.thumbnail || video.thumb || video.thumbnail_url || "https://via.placeholder.com/320x180?text=No+Thumbnail",
                        embedUrl: video.embed_url || video.stream_url || video.url || video.file_code ? `https://streamhub.com/e/${video.file_code || video.id}` : "#",
                        views: video.views || video.view_count || 0
                    }));
                    renderVideoGrid(allVideos);
                } else {
                    loadSampleVideos();
                }
                
            } catch (error) {
                console.error("API Error:", error);
                loadSampleVideos();
                showErrorState(`API Error: ${error.message}. The API endpoints need to be corrected.`);
            }
        }
        
        function setupNavigation() {
            document.querySelector('.nav-home').addEventListener('click', () => {
                document.getElementById('pageTitle').textContent = 'Recommended';
                document.getElementById('pageDesc').textContent = 'Your personal video streaming platform';
                renderVideoGrid(allVideos);
            });
            
            document.querySelector('.nav-categories').addEventListener('click', () => {
                document.getElementById('pageTitle').textContent = 'Categories';
                document.getElementById('pageDesc').textContent = 'Browse by category';
                document.getElementById('videosGrid').innerHTML = `
                    <div class="empty-state">
                        <h3>🏷️ Categories Coming Soon</h3>
                        <p>This feature will be available in the next update</p>
                    </div>
                `;
            });
            
            document.querySelector('.nav-live').addEventListener('click', () => {
                document.getElementById('pageTitle').textContent = 'Live Cams';
                document.getElementById('pageDesc').textContent = 'Live streaming';
                document.getElementById('videosGrid').innerHTML = `
                    <div class="empty-state">
                        <h3>📡 Live Cams Coming Soon</h3>
                        <p>This feature will be available in the next update</p>
                    </div>
                `;
            });
        }
        
        async function init() {
            setupNavigation();
            await loadVideos();
        }
        
        init();
    </script>
</body>
</html>
